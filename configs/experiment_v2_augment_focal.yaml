# ===================================================================
# Experiment v2_focal: Domain-Shift Augmentations + Focal Loss
# ===================================================================
# Changes from v2_augment:
#   + Focal loss instead of BCE (gamma=2.0, alpha=0.25)
#   Helps rare species and hard negatives
# ===================================================================

run_name: v2_augment_focal_fold0
seed: 42
fold: 0

# Data
folds_csv: data/folds/folds.csv
spec_dir: data/processed
train_meta_csv: data/raw/train.csv
audio_dir: data/raw/train_audio
num_workers: 4

# Model
backbone: tf_efficientnet_b0_ns
num_classes: 234
dropout: 0.3
pretrained: true

# Training
epochs: 30
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-4
scheduler: cosine
warmup_epochs: 2

# Loss — FOCAL (changed from BCE)
loss: focal
focal_gamma: 2.0
focal_alpha: 0.25

# Original augmentations
spec_augment: true
time_mask_max: 50
freq_mask_max: 20
mixup_alpha: 0.4
gaussian_noise_std: 0.01

# Domain-shift augmentations (same as v2)
bg_noise: true
aug_bg_noise_p: 0.5
snr_min_db: 5.0
snr_max_db: 20.0
random_gain: true
aug_gain_p: 0.5
gain_range_db: 6.0
random_filter: true
aug_filter_p: 0.4
silence_embed: true
aug_silence_p: 0.3
sample_rate: 32000
window_seconds: 5.0
