# Phase 2 finetune config — consumed by src/training/finetune.py (NOT train.py)
# init_checkpoint is supplied via --init-checkpoint CLI flag, per-fold, by the
# orchestration script. We do NOT set it in the config.
experiment_name: effv2s_finetune
seed: 42
fold: 0

# Model architecture (must match Phase 1 to load weights with strict=True)
model_type: sed
backbone: tf_efficientnetv2_s.in21k_ft_in1k
num_classes: 234
dropout: 0.3
pretrained: false
attention_hidden_dim: 128
input_normalize: false
encoder_in_chans: 1

# Data — focal
train_meta_csv: data/raw/train.csv
folds_csv: data/folds/folds.csv
spec_dir: data/processed
audio_dir: data/raw/train_audio

# Data — soundscape (labeled, for both training mix and validation)
soundscape_folds_csv: data/folds/folds_soundscapes.csv
soundscape_spec_dir: data/processed_soundscapes
soundscape_ratio: 0.3

# NOT using pseudo-labels for first V2-S finetune. Reason: matching the B0 0.88
# baseline recipe (which also didn't use pseudo) gives a clean comparison and
# avoids debugging the species-cap mechanism on a new backbone. We can layer
# pseudo on later if the no-pseudo V2-S already adds LB.

# Spec params
sample_rate: 32000
window_seconds: 5.0

# Training — HALF B0 finetune LR because V2-S pretrained features are more fragile
epochs: 10
batch_size: 32
num_workers: 4
lr: 5.0e-5
weight_decay: 1.0e-4
warmup_epochs: 1
loss: bce

# Augmentation matches B0 finetune
spec_augment: true
time_mask_max: 50
freq_mask_max: 20
aug_spec_p: 0.5
mixup_alpha: 0.4
aug_mixup_p: 0.5
gaussian_noise_std: 0.01
aug_noise_p: 0.5
