# SED (Sound Event Detection) with EfficientNet-B0 + attention pooling over time.
# All training hyperparameters held constant vs. baseline so the delta isolates
# the architectural change.
#
# NOTE: run_name is intentionally NOT set here. The per-fold runner sets
# BIRDCLEF_RUN_NAME=sed_b0_fold{N} as an env var so each fold writes to
# a distinct experiment dir. A static run_name in the config would cause
# every fold to overwrite the same directory — a silent disaster.

experiment_name: sed_b0
seed: 42

# --- Data paths (must match baseline) ---
train_meta_csv: data/raw/train.csv
folds_csv: data/folds/folds.csv
audio_dir: data/raw/train_audio
spec_dir: data/processed
fold: 0
num_workers: 4

# --- Model ---
model_type: sed
backbone: tf_efficientnet_b0_ns
num_classes: 234
dropout: 0.3
attention_hidden_dim: 128
pretrained: true

# --- Training (identical to baseline) ---
epochs: 30
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-4
scheduler: cosine
warmup_epochs: 2

# --- Loss (identical to baseline) ---
loss: bce

# --- Augmentations (identical to baseline) ---
spec_augment: true
time_mask_max: 50
freq_mask_max: 20
mixup_alpha: 0.4
gaussian_noise_std: 0.01

# --- Spectrogram config (must match cached .npy files) ---
sample_rate: 32000
n_mels: 128
fmax: 16000
hop_length: 512
n_fft: 2048
window_seconds: 5.0
