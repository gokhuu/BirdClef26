# Phase 2 finetune — flat schema matching src/training/train.py
# 2 is sed-substituted per-fold by scripts/train_all_folds.sh
# Run (after sed substitution):
#   BIRDCLEF_RUN_NAME=effv2s_finetune_fold0 python -m src.training.train configs/_generated/finetune_effv2s_fold0.yaml --fold 0
experiment_name: effv2s_finetune
seed: 42
fold: 0

# Model
model_type: sed
backbone: tf_efficientnetv2_s.in21k_ft_in1k
num_classes: 234
dropout: 0.3
pretrained: false
attention_hidden_dim: 128
input_normalize: false
encoder_in_chans: 1

# Warmstart from Phase 1 (script substitutes 2)
init_checkpoint: experiments/effv2s_focal_fold2/best_model.pt

# Data
train_meta_csv: data/raw/train.csv
folds_csv: data/folds/folds.csv
spec_dir: data/processed
audio_dir: data/raw/train_audio

# Soundscape mixing (matches your B0 0.88 finetune)
soundscape_folds_csv: data/folds/folds_soundscapes.csv
soundscape_spec_dir: data/processed_soundscapes
soundscape_ratio: 0.3

# Spec params
sample_rate: 32000
window_seconds: 5.0

# Training — HALF B0 finetune LR because V2-S pretrained features are more fragile
epochs: 10
batch_size: 32
num_workers: 4
lr: 5.0e-5
weight_decay: 1.0e-4
warmup_epochs: 1
loss: bce

# Augmentation matches B0 finetune
spec_augment: true
time_mask_max: 50
freq_mask_max: 20
aug_spec_p: 0.5
mixup_alpha: 0.4
aug_mixup_p: 0.5
gaussian_noise_std: 0.01
aug_noise_p: 0.5
