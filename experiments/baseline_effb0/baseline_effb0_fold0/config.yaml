run_name: baseline_effb0_fold0
seed: 42
fold: 0

# Data
folds_csv: data/folds/folds.csv
spec_dir: data/processed
train_meta_csv: data/raw/train.csv
audio_dir: data/raw/train_audio
num_workers: 4

# Model
backbone: tf_efficientnet_b0_ns
num_classes: 234
dropout: 0.3
pretrained: true

# Training
epochs: 30
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-4
scheduler: cosine
warmup_epochs: 2

# Augmentations
spec_augment: true
time_mask_max: 50
freq_mask_max: 20
mixup_alpha: 0.4
gaussian_noise_std: 0.01
